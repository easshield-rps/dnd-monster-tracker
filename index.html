<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hunter's Ledger</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Temporary fonts - can replace later -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="bookCover">

    <div class="cover">

        <div class="coverBorder">

            <div class="crest">

                ⚔

            </div>

            <h1>Hunter's Ledger</h1>

            <h2>Property of the Adventurers' Guild</h2>

            <p class="quote">

                "Knowledge is our greatest weapon."

            </p>

            <button id="openBook">

                Open Ledger

            </button>

        </div>

    </div>

</div>



<div id="ledger" class="hidden">

<header>

    <div class="titleArea">

        <h1>Hunter's Ledger</h1>

        <p>The Guild's Official Bestiary</p>

    </div>

</header>


<nav>

    <button class="navButton active">Dashboard</button>
    <button class="navButton">Bestiary</button>
    <button class="navButton">Achievements</button>
    <button class="navButton">Settings</button>

</nav>


<section class="hero">

    <div class="overallShield">

        <div class="shield">

            <div class="shieldPercent">

                <span id="overallPercent">29.95%</span>

            </div>

        </div>

    </div>

    <div class="overallStats">

        <h2>

            130 / 434

        </h2>

        <p>

            Creatures Catalogued

        </p>

        <div class="progressText">

            304 Remaining

        </div>

    </div>

</section>


<section class="searchSection">

<input

type="text"

id="searchBox"

placeholder="Search the Bestiary..."

>

</section>


<section class="categoryGrid">

</section>


<footer>

Hunter's Ledger

Version 0.1

</footer>

</div>

<script src="js/app.js"></script>

</body>

</html>
